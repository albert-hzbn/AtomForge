name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# The Rust workspace (rust/): the AtomForge program (desktop and command line)
# and the native libraries of the Python package. The UI scripts
# (rust/tools/run_ui_tests.py) need a GPU and a display and run locally.
jobs:
  # --------------------------------------------------------------------------
  # Linux
  # --------------------------------------------------------------------------
  build-linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsymspg-dev \
            libx11-dev libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        working-directory: rust
        run: cargo build --release -p af-app -p af-ffi-science -p af-ffi-electronic

      - name: Test
        working-directory: rust
        run: cargo test --workspace --release

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scientific Python integrations
        run: python -m pip install './python[science]'

      - name: Test the Python package against the native libraries
        env:
          ATOMFORGE_PATH: ${{ github.workspace }}/rust/target/release/AtomForge
          ATOMFORGE_SCIENCE_LIBRARY: ${{ github.workspace }}/rust/target/release/libatomforge_science_native.so
          ATOMFORGE_ELECTRONIC_LIBRARY: ${{ github.workspace }}/rust/target/release/libatomforge_electronic.so
        working-directory: python
        run: python -m unittest discover -s tests

      - name: Command-line smoke test
        run: python tests/cli_smoke.py rust/target/release/AtomForge

  # --------------------------------------------------------------------------
  # Windows (MSVC)
  # --------------------------------------------------------------------------
  build-windows:
    name: Windows (MSVC)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        working-directory: rust
        run: cargo build --release -p af-app -p af-ffi-science -p af-ffi-electronic

      - name: Test
        working-directory: rust
        run: cargo test --workspace --release

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Portable package
        run: python rust/tools/package.py --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: AtomForge-win64
          path: rust/target/package/*.zip
