[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
af-core = { path = "crates/af-core" }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
glam = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rayon = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
